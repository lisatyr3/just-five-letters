<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Just 5 Letters</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#1a1a1a;
      --muted:#666;
      --tile:#ffffff;
      --border:#d0d0d0;
      --shadow:0 1px 0 rgba(0,0,0,.04);
      --good:#6aaa64;   /* correct spot */
      --maybe:#c9b458;  /* in word, wrong spot */
      --bad:#787c7e;    /* not in word */
      --keybg:#e9e9e9;
      --max:720px;
    }

    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:18px 14px 28px;
      text-align:center;
    }

    h1{
      margin:6px 0 6px;
      font-size:1.7rem;
      letter-spacing:.2px;
    }
    .sub{
      margin:0 0 14px;
      color:var(--muted);
      font-size:.98rem;
      line-height:1.3;
    }

    .board{
      display:grid;
      gap:10px;
      justify-content:center;
      margin:14px auto 12px;
      padding:10px;
    }

    .row{
      display:grid;
      grid-template-columns: repeat(5, 54px);
      gap:10px;
      justify-content:center;
    }

    .cell{
      width:54px;
      height:54px;
      border:2px solid var(--border);
      border-radius:10px;
      background:var(--tile);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.55rem;
      font-weight:700;
      text-transform:uppercase;
      box-shadow:var(--shadow);
      user-select:none;
    }

    /* feedback colors */
    .cell.good{ background:var(--good); border-color:var(--good); color:#fff; }
    .cell.maybe{ background:var(--maybe); border-color:var(--maybe); color:#fff; }
    .cell.bad{ background:var(--bad); border-color:var(--bad); color:#fff; }

    .controls{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    input[type="text"]{
      width:min(320px, 92vw);
      padding:12px 12px;
      font-size:1.05rem;
      border:2px solid var(--border);
      border-radius:10px;
      outline:none;
      text-transform:uppercase;
    }

    button{
      padding:12px 14px;
      font-size:1.02rem;
      border:0;
      border-radius:10px;
      cursor:pointer;
      background:#111;
      color:#fff;
    }

    button.secondary{
      background:#e9e9e9;
      color:#111;
      border:1px solid #d6d6d6;
    }

    .msg{
      margin:12px auto 0;
      min-height:26px;
      font-size:1rem;
    }
    .msg.ok{ color:#146c2e; font-weight:600; }
    .msg.err{ color:#a11; font-weight:600; }

    /* ===== NEW LETTER BOARD KEYBOARD STYLES ===== */
    .keyboard {
      margin: 24px auto 10px;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: none;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .key {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      background: var(--keybg);
      color: var(--text);
      border: 0;
      border-radius: 4px;
      height: 48px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.15s ease, color 0.15s ease;
      padding: 0;
    }

    .key.good { background: var(--good); color: #fff; }
    .key.maybe { background: var(--maybe); color: #fff; }
    .key.bad { background: var(--bad); color: #fff; }

    .footer{
      margin-top:14px;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.35;
    }

    /* Mobile fit */
    @media (max-width: 380px){
      .row{ grid-template-columns: repeat(5, 46px); gap:8px; }
      .cell{ width:46px; height:46px; font-size:1.35rem; border-radius:9px; }
      .board{ gap:8px; padding:6px; }
      .key { height: 40px; font-size: 0.85rem; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Just 5 Letters</h1>
    <p class="sub">Guess the 5-letter word in 6 tries. Type your guess below and hit Submit.</p>

    <div id="board" class="board" aria-label="Just 5 Letters board"></div>

    <div class="controls">
      <input id="guessInput" type="text" inputmode="text" autocomplete="off" maxlength="5"
             placeholder="Type 5 letters…" aria-label="Guess input" />
      <button id="submitBtn">Submit</button>
      <button id="resetBtn" class="secondary" title="Clear today's progress">Reset Today</button>
    </div>

    <div id="message" class="msg" role="status" aria-live="polite"></div>

    <!-- NEW: Letter Board Elements Containers -->
    <div id="keyboard" class="keyboard" aria-label="Letter board status"></div>

    <div class="footer">
      New word each day at midnight. 🙂
    </div>
  </div>

  <script>
    // ---------------------------
    // 1) WORD LIST (all 5 letters)
    // ---------------------------
const WORDS = [
"APPLE","BEACH","BRAIN","BREAD","BRICK","BRAVE","CHAIR","CHEER","CHESS","CLOUD",
"COAST","CRAFT","CRISP","DAISY","DREAM","DRIVE","EARTH","FAITH","FLAME","FRESH",
"GIANT","GRACE","GRAPE","GREEN","HONEY","HUMOR","IVORY","JUICE","LEMON","LIGHT",
"MAPLE","MUSIC","NURSE","OCEAN","PAINT","PEACE","PEARL","PLANT","PRIDE","QUEEN",
"RIVER","ROUND","SHEEP","SMILE","SPARK","SPICE","STONE","SUGAR","SWEET","TABLE",
"TEACH","TIGER","TRUST","UNDER","WATER","WHEAT","WORLD","YEAST","ZEBRA",

"ALIVE","ANGEL","BASIC","BLOOM","BLEND","BROWN","CARRY","CATCH","CLEAN","CLEAR",
"CLOSE","COUNT","COVER","DANCE","DEPTH","DOUBT","DOZEN","EAGER","EARLY","ENJOY",
"ENTER","EQUAL","EVENT","EXACT","EXIST","EXTRA","FIELD","FINAL","FIRST","FOCUS",
"FORCE","FORTH","FRAME","FRONT","FRUIT","GLASS","GLOVE","GRAND","GRASS","GREAT",
"GUEST","GUIDE","HEART","HEAVY","HUMAN","IDEAL","IMAGE","INDEX","INNER","ISSUE",
"JUDGE","KNIFE","KNOWN","LABEL","LARGE","LATER","LAUGH","LAYER","LEARN","LEVEL",
"LIVER","LOCAL","LOGIC","LOOSE","LUCKY","MAJOR","MAKER","MATCH","METAL","MIGHT",
"MINOR","MODEL","MONEY","MONTH","MOTOR","MOUTH","MOVIE","NEEDS","NIGHT","NOISE",
"NORTH","NOVEL","NURSE","OFFER","ORDER","OTHER","OWNER","PANEL","PARTY","PEACE",
"PHASE","PHONE","PHOTO","PIECE","PILOT","PITCH","PLACE","PLAIN","PLANE","POINT",
"POWER","PRESS","PRICE","PRIME","PRINT","PRIZE","PROOF","PROUD","QUICK","QUIET",
"RADIO","RAISE","REACH","READY","RIGHT","RANGE","RAPID","RATIO","REFER","RELAX",
"REPLY","RESET","RESIN","RHYME","RIDER","ROBIN","ROUGH","ROUTE","ROYAL","RURAL",
"SCALE","SCENE","SCOPE","SCORE","SENSE","SERVE","SHADE","SHAKE","SHARE","SHARP",
"SHEET","SHELF","SHIFT","SHINE","SHIRT","SHOCK","SHOOT","SHORT","SHOWN","SIDES",
"SIGHT","SINCE","SKILL","SLEEP","SMALL","SMART","SMOKE","SOLID","SOLVE","SORRY",
"SOUND","SOUTH","SPACE","SPARE","SPEED","SPEND","SPENT","SPLIT","SPORT","STAFF",
"STAGE","STAIR","STAKE","STAND","START","STATE","STEEL","STICK","STILL","STOCK",
"STORE","STORM","STORY","STRIP","STYLE","SUGAR","SUITE","SUPER","SWEAR","SWEEP",
"SWEET","SWING","TABLE","TAKEN","TASTE","TEACH","THANK","THEME","THERE","THICK",
"THING","THINK","THIRD","THOSE","THROW","TIGHT","TIMES","TIRED","TITLE","TODAY",
"TOPIC","TOTAL","TOUCH","TOUGH","TOWER","TRACK","TRADE","TRAIN","TREAT","TREND",
"TRIAL","TRUST","TRUTH","TWICE","UNDER","UNION","UNITY","UPPER","URBAN","USAGE",
"USUAL","VALUE","VIDEO","VISIT","VOICE","WASTE","WATCH","WATER","WEIGH","WHILE",
"WHITE","WHOLE","WOMAN","WOMEN","WORLD","WORRY","WORTH","WRITE","WRONG","YIELD"
];

    const STRICT_DICTIONARY = false;

    // ---------------------------
    // 2) DAILY WORD (changes at midnight, local time)
    // ---------------------------
    function ymdLocal(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }

    function dayIndexLocal(){
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const base = new Date(2025, 0, 1); // Jan 1, 2025 local
      const msPerDay = 24*60*60*1000;
      return Math.floor((todayMidnight - base) / msPerDay);
    }

    function dailyAnswer(){
      const idx = dayIndexLocal();
      const pick = ((idx % WORDS.length) + WORDS.length) % WORDS.length;
      return WORDS[pick];
    }

    const todayKey = `J5L_${ymdLocal(new Date())}`;
    const ANSWER = dailyAnswer();

    // ---------------------------
    // 3) STATE (saved per-day)
    // ---------------------------
    const MAX_TRIES = 6;
    let state = loadState() || {
      guesses: [],    
      done: false,
      win: false
    };

    function loadState(){
      try{
        const raw = localStorage.getItem(todayKey);
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        return null;
      }
    }

    function saveState(){
      try{
        localStorage.setItem(todayKey, JSON.stringify(state));
      }catch(e){}
    }

    // ---------------------------
    // 4) UI BUILD
    // ---------------------------
    const boardEl = document.getElementById("board");
    const msgEl = document.getElementById("message");
    const inputEl = document.getElementById("guessInput");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const keyboardEl = document.getElementById("keyboard"); // Connected container

    // Standard Layout Rows
    const KB_LAYOUT = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["Z","X","C","V","B","N","M"]
    ];

    function setMessage(text, kind=""){
      msgEl.textContent = text;
      msgEl.className = "msg" + (kind ? " " + kind : "");
    }

    function buildBoard(){
      boardEl.innerHTML = "";
      for(let r=0; r<MAX_TRIES; r++){
        const row = document.createElement("div");
        row.className = "row";
        for(let c=0; c<5; c++){
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("data-r", r);
          cell.setAttribute("data-c", c);
          row.appendChild(cell);
        }
        boardEl.appendChild(row);
      }
    }

    // NEW: Builds the structural visual components of the letter board
    function buildKeyboard(){
      keyboardEl.innerHTML = "";
      KB_LAYOUT.forEach(rowKeys => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "kb-row";
        rowKeys.forEach(letter => {
          const btn = document.createElement("button");
          btn.className = "key";
          btn.textContent = letter;
          btn.setAttribute("data-key", letter);
          
          // Click handler allows users to tap letters to add to their input container
          btn.addEventListener("click", () => {
            if (state.done) return;
            if (inputEl.value.length < 5) {
              inputEl.value = cleanGuess(inputEl.value + letter);
            }
            inputEl.focus();
          });
          
          rowDiv.appendChild(btn);
        });
        keyboardEl.appendChild(rowDiv);
      });
    }

    function scoreGuess(guess, answer){
      guess = guess.toUpperCase();
      answer = answer.toUpperCase();

      const out = Array(5).fill("bad");
      const answerArr = answer.split("");
      const used = Array(5).fill(false);

      for(let i=0;i<5;i++){
        if(guess[i] === answerArr[i]){
          out[i] = "good";
          used[i] = true;
        }
      }
      for(let i=0;i<5;i++){
        if(out[i] === "good") continue;
        const ch = guess[i];
        let foundIdx = -1;
        for(let j=0;j<5;j++){
          if(!used[j] && answerArr[j] === ch){
            foundIdx = j;
            break;
          }
        }
        if(foundIdx >= 0){
          out[i] = "maybe";
          used[foundIdx] = true;
        }
      }
      return out;
    }

    // NEW: Determines priority status mapping for keys
    function updateKeyboardStatus(){
      const keyStatuses = {};

      state.guesses.forEach(g => {
        const scores = scoreGuess(g, ANSWER);
        for(let i = 0; i < 5; i++) {
          const char = g[i];
          const currentScore = scores[i];
          const existingScore = keyStatuses[char];

          // Priority hierarchy: good beats maybe, maybe beats bad
          if (!existingScore) {
            keyStatuses[char] = currentScore;
          } else if (existingScore === "maybe" && currentScore === "good") {
            keyStatuses[char] = "good";
          } else if (existingScore === "bad" && (currentScore === "maybe" || currentScore === "good")) {
            keyStatuses[char] = currentScore;
          }
        }
      });

      // Apply classes to key elements
      const keys = keyboardEl.querySelectorAll(".key");
      keys.forEach(k => {
        const letter = k.getAttribute("data-key");
        k.className = "key"; // clear status classes
        if (keyStatuses[letter]) {
          k.classList.add(keyStatuses[letter]);
        }
      });
    }

    function render(){
      const cells = boardEl.querySelectorAll(".cell");
      cells.forEach(c=>{
        c.textContent = "";
        c.className = "cell";
      });

      state.guesses.forEach((g, r)=>{
        const scores = scoreGuess(g, ANSWER);
        for(let c=0; c<5; c++){
          const cell = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
          if(!cell) continue;
          cell.textContent = g[c] ? g[c].toUpperCase() : "";
          cell.classList.add(scores[c]);
        }
      });

      // Update the status on our new letter board keys
      updateKeyboardStatus();

      if(state.done){
        inputEl.disabled = true;
        submitBtn.disabled = true;
        if(state.win){
          setMessage("Nice job! Thanks for playing. Come back tomorrow for a new word.", "ok");
        }else{
          setMessage(`Good try! Today’s word was ${ANSWER}. Come back tomorrow for a new one.`, "err");
        }
      }else{
        inputEl.disabled = false;
        submitBtn.disabled = false;
        setMessage("");
        inputEl.focus();
      }
    }

    // ---------------------------
    // 5) INPUT LOGIC (box + submit)
    // ---------------------------
    function cleanGuess(val){
      return (val || "")
        .toUpperCase()
        .replace(/[^A-Z]/g, "")
        .slice(0,5);
    }

    function isValidGuess(g){
      if(g.length !== 5) return false;
      if(!STRICT_DICTIONARY) return true;
      return WORDS.includes(g);
    }

    function submitGuess(){
      if(state.done) return;

      const g = cleanGuess(inputEl.value);
      inputEl.value = g;

      if(g.length !== 5){
        setMessage("Type a 5-letter word, then hit Submit.", "err");
        return;
      }
      if(!isValidGuess(g)){
        setMessage("That word isn’t in my list. Try a different 5-letter word.", "err");
        return;
      }

      state.guesses.push(g);
      saveState();

      if(g === ANSWER){
        state.done = true;
        state.win = true;
        saveState();
      }else if(state.guesses.length >= MAX_TRIES){
        state.done = true;
        state.win = false;
        saveState();
      }

      inputEl.value = "";
      render();
    }

    inputEl.addEventListener("input", ()=>{
      inputEl.value = cleanGuess(inputEl.value);
    });

    inputEl.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        e.preventDefault();
        submitGuess();
      }
    });

    submitBtn.addEventListener("click", submitGuess);

    resetBtn.addEventListener("click", ()=>{
      localStorage.removeItem(todayKey);
      state = { guesses: [], done:false, win:false };
      inputEl.value = "";
      setMessage("Reset done. You can play today again.", "ok");
      render();
    });

    // ---------------------------
    // 6) INIT
    // ---------------------------
    buildBoard();
    buildKeyboard(); // Initialize on run
    render();
  </script>
</body>
</html>
